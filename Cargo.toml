[package]
name = "rustbcx"
description = "GPU texture compression in pure Rust: BC1-5, BC6H and BC7 blocks, whole textures with mip levels, DDS and KTX files. Ported from bc7enc_rdo, bc7e, bcdec and the ISPC Texture Compressor: bit-identical output, no dependencies, no unsafe code."
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OctoKeights/rustbcx"
readme = "README.md"
keywords = ["bc7", "bc6h", "dds", "texture", "compression"]
categories = ["compression", "graphics", "game-development"]

[dependencies]

[features]
# The hottest loops written with `std::simd`, which needs a nightly compiler. The blocks are
# the same with and without it.
nightly-simd = []
