[package]
name = "rustbcx"
description = "GPU texture compression in pure Rust: BC1 to BC7 blocks and whole textures with mip levels (plain, arrays, cube maps, volumes) in DDS and KTX files, with zlib and Zstandard, from PNG, BMP, JPEG and EXR pictures. Ports of bc7enc_rdo, bc7e, bcdec, the ISPC Texture Compressor, DirectXTex's BC6H encoder, miniz, zstd, stb_image and tinyexr: bit-identical output, no dependencies, no unsafe code."
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OctoKeights/rustbcx"
readme = "README.md"
keywords = ["bc7", "bc6h", "dds", "texture", "compression"]
categories = ["compression", "graphics", "game-development"]

[dependencies]

[features]
# The hottest loops written with `std::simd`, which needs a nightly compiler. The blocks are
# the same with and without it.
nightly-simd = []
