[package]
name = "rustbcx"
description = "Deterministic BC1 to BC7 GPU texture compression in pure, safe Rust: bit-identical ports of bc7enc_rdo and related encoders, with DDS and KTX output."
version = "0.7.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/OctoKeights/rustbcx"
readme = "README.md"
keywords = ["bc7", "bc6h", "dds", "texture", "compression"]
categories = ["compression", "graphics", "game-development"]

[dependencies]
miniz_nrp = { version = "0.2.1", git = "https://github.com/OctoKeights/miniz_nrp" }
stb_image_nrp = { version = "0.2.1", git = "https://github.com/OctoKeights/stb_image_nrp" }
stb_image_write_nrp = { version = "0.2.1", git = "https://github.com/OctoKeights/stb_image_write_nrp" }
tinyexr_nrp = { version = "0.3.0", git = "https://github.com/OctoKeights/tinyexr_nrp" }
zstd_nrp = { version = "0.2.1", git = "https://github.com/OctoKeights/zstd_nrp" }

[features]
# The hottest loops written with `std::simd`, which needs a nightly compiler. The blocks are
# the same with and without it.
nightly-simd = []

[lints.rust]
# No unsafe code in the library, its tests, examples or benchmarks.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Integer and float conversions that narrow or reinterpret are the codec's arithmetic, as they
# are in the original's C; each is deliberate, so these four are not flagged.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Flags clear pairs of names such as max_ac and max_dc, or runs and rune.
similar_names = "allow"
# The encoders compare errors and values exactly, and take midpoints as (a + b) / 2, as the
# originals do; an epsilon or `midpoint` would change which blocks they choose.
float_cmp = "allow"
manual_midpoint = "allow"
