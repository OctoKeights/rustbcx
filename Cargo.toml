[package]
name = "rustbcx"
description = "Deterministic BC1 to BC7 GPU texture compression in pure, safe Rust: bit-identical ports of bc7enc_rdo and related encoders, with DDS and KTX output and no dependencies."
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OctoKeights/rustbcx"
readme = "README.md"
keywords = ["bc7", "bc6h", "dds", "texture", "compression"]
categories = ["compression", "graphics", "game-development"]

[dependencies]

[features]
# The hottest loops written with `std::simd`, which needs a nightly compiler. The blocks are
# the same with and without it.
nightly-simd = []
